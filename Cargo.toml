[workspace]

[package]
name = "google-ad-manager-mcp"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Public Rust MCP server for Google Ad Manager workflows."
repository = "https://github.com/sednalabs/google-ad-manager-mcp"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
gcp_auth = "0.12.6"
mcp-toolkit-server = { version = "0.1.0", git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "785c4b5c209ad1d77827bcf92fa5ed89777698da", package = "mcp-toolkit-server", features = ["stdio"] } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
mcp-toolkit-auth = { version = "0.1.0", git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "785c4b5c209ad1d77827bcf92fa5ed89777698da", package = "mcp-toolkit-auth" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
mcp-toolkit-core = { version = "0.1.0", git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "785c4b5c209ad1d77827bcf92fa5ed89777698da", package = "mcp-toolkit-core" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
mcp-toolkit-observability = { version = "0.1.0", git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "785c4b5c209ad1d77827bcf92fa5ed89777698da", package = "mcp-toolkit-observability", features = ["tracing-bridge"] } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
mcp-toolkit-scratchpad = { version = "0.1.0", git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "785c4b5c209ad1d77827bcf92fa5ed89777698da", package = "mcp-toolkit-scratchpad", features = ["tokio"] } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
roxmltree = "0.21.1"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

[dev-dependencies]
mcp-toolkit-testing = { version = "0.1.0", git = "https://github.com/sednalabs/mcp-toolkit-rs", rev = "785c4b5c209ad1d77827bcf92fa5ed89777698da", package = "mcp-toolkit-testing" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.

[patch.crates-io]
rmcp = { git = "https://github.com/sednalabs/rust-sdk", rev = "31e83f4f752001d2afc386254a4d17b5eab5f419" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
rmcp-macros = { git = "https://github.com/sednalabs/rust-sdk", rev = "31e83f4f752001d2afc386254a4d17b5eab5f419" } # DevSkim: ignore DS173237 because this immutable public commit ID is source identity, not a credential.
